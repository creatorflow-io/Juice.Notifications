# Juice Notifications: local stack. Run scripts/init.sh once first.
#
#   PostgreSQL   localhost:5434    database "notifications" (the app migrates it; tests create scratch databases)
#   RabbitMQ     localhost:5673    management UI http://localhost:15673 (from M2: NotificationRequested intake)
#   Keycloak     http://localhost:8081   realm "juice" (admin console: admin / KEYCLOAK_ADMIN_PASSWORD)
#   Mailpit      SMTP localhost:1026, UI http://localhost:8026 (from M6: the SMTP provider's test sink)
#   app          http://localhost:5280 with --profile app (the service from the Dockerfile; otherwise scripts/run-app.sh)
#
# Ports avoid the Juice.Observability stack's, so both can run at once. Images are pinned; change versions here and in README.md together.
name: juice-notifications

services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init.sh}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: notifications
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run scripts/init.sh}
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run scripts/init.sh}
      KC_HOSTNAME: http://localhost:8081
      # Tokens name localhost:8081 as issuer; a container (the app profile) reads metadata and keys from keycloak:8080.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      NOTIFICATIONS_ADMIN_CLIENT_SECRET: ${NOTIFICATIONS_ADMIN_CLIENT_SECRET}
      SAMPLE_PRODUCER_CLIENT_SECRET: ${SAMPLE_PRODUCER_CLIENT_SECRET}
      TENANT_ADMIN_CLIENT_SECRET: ${TENANT_ADMIN_CLIENT_SECRET}
    volumes:
      - ./keycloak/juice-realm.json:/opt/keycloak/data/import/juice-realm.json:ro
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"

  # The service itself, from the repository's Dockerfile: `docker compose --profile app up -d --build --wait`. Off by default, so tests and
  # scripts/run-app.sh (the same port) keep working without it.
  app:
    profiles: ["app"]
    # Longer than the service's 45 s shutdown: a send under way finishes and is recorded rather than being cut off and repeated.
    stop_grace_period: 50s
    build:
      context: ../..
    environment:
      ConnectionStrings__Notifications: "Host=postgres;Port=5432;Database=notifications;Username=notifications;Password=${POSTGRES_PASSWORD}"
      Database__Migrate: "true"
      Auth__Authority: http://localhost:8081/realms/juice
      Auth__MetadataAddress: http://keycloak:8080/realms/juice/.well-known/openid-configuration
      Auth__RequireHttpsMetadata: "false"
      Delivery__AllowHttpToAllowlisted: "true"
      Delivery__SmtpServers__local__Host: mailpit
      Delivery__SmtpServers__local__Port: "1025"
      Delivery__SmtpServers__local__Security: None
      NOTIFICATIONS_SECRET_SAMPLE_HOOK: ${SAMPLE_WEBHOOK_SECRET:-}
      # NotificationRequested over RabbitMQ (phase-1-plan I5); producers publish as their own broker user (README: RabbitMQ intake).
      Intake__RabbitMQ__Enabled: "true"
      Intake__RabbitMQ__Host: rabbitmq
      Intake__RabbitMQ__UserName: notifications
      Intake__RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5280:8080"
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_started }

volumes:
  postgres-data:
