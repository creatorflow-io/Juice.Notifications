# Juice Notifications: local stack. Run scripts/init.sh once first.
#
#   PostgreSQL   localhost:5434    database "notifications" (the app migrates it; tests create scratch databases)
#   RabbitMQ     localhost:5673    management UI http://localhost:15673 (from M2: NotificationRequested intake)
#   Keycloak     http://localhost:8080   shared: ../../../../dev-infra, started first (realm "juice", SSO with the other Juice apps)
#   Mailpit      SMTP localhost:1026, UI http://localhost:8026 (from M6: the SMTP provider's test sink)
#   audit        gRPC localhost:5285 (h2c): services/audit's host, records in schema "audit" of the notifications database (p1-09)
#   Redis        localhost:6380 (from M15: the inbox hub's SignalR backplane, for the two-replica test)
#   app          http://localhost:5280 with --profile app (the service from the Dockerfile; otherwise scripts/run-app.sh)
#
# Ports avoid the Juice.Observability stack's, so both can run at once. Images are pinned; change versions here and in README.md together.
name: juice-notifications

services:
  postgres:
    image: postgres:17.10-alpine
    # The integration tests run their classes in parallel, each with a host of its own (stage workers, outbox delivery, pools): past the default
    # 100 connections a step fails to connect and backs off, and a test on a fixed clock waits for it forever.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init.sh}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: notifications
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run scripts/init.sh}
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # services/audit's gRPC host (deploy/local/audit): the service's audit records (p1-09), stored in schema "audit" of the notifications database.
  audit:
    build:
      context: ./audit
    environment:
      ConnectionStrings__PostgreConnection: "Host=postgres;Port=5432;Database=notifications;Username=notifications;Password=${POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:5285:8080"
    depends_on:
      postgres: { condition: service_healthy }

  # The service itself, from the repository's Dockerfile: `docker compose --profile app up -d --build --wait`. Off by default, so tests and
  # scripts/run-app.sh (the same port) keep working without it.
  app:
    profiles: ["app"]
    # Longer than the service's 45 s shutdown: a send under way finishes and is recorded rather than being cut off and repeated.
    stop_grace_period: 50s
    build:
      context: ../..
    environment:
      ConnectionStrings__Notifications: "Host=postgres;Port=5432;Database=notifications;Username=notifications;Password=${POSTGRES_PASSWORD}"
      Database__Migrate: "true"
      # The shared Keycloak's issuer (dev-infra), as its PUBLIC_HOST names it.
      Auth__Authority: http://${PUBLIC_HOST:-localhost}:8080/realms/juice
      Auth__MetadataAddress: http://keycloak:8080/realms/juice/.well-known/openid-configuration
      Auth__RequireHttpsMetadata: "false"
      # The tenant pattern (juice-docs decision record): the local realm's tenants (README, people), active; any other is unknown.
      Tenancy__Directory: Configured
      Tenancy__Tenants__0__Id: 0193f0aa-0000-7000-8000-0000000000a1
      Tenancy__Tenants__0__Identifier: local
      Tenancy__Tenants__0__Name: Local tenant
      Tenancy__Tenants__1__Id: 0193f0aa-0000-7000-8000-0000000000b2
      Tenancy__Tenants__1__Identifier: other
      Tenancy__Tenants__1__Name: Other tenant
      Delivery__AllowHttpToAllowlisted: "true"
      Delivery__SmtpServers__local__Host: mailpit
      Delivery__SmtpServers__local__Port: "1025"
      Delivery__SmtpServers__local__Security: None
      NOTIFICATIONS_SECRET_SAMPLE_HOOK: ${SAMPLE_WEBHOOK_SECRET:-}
      # Contact addresses and device tokens are encrypted under these (Encryption:KeyRef and HashKeyRef name them); scripts/init.sh writes them.
      NOTIFICATIONS_CONTACT_KEY: ${NOTIFICATIONS_CONTACT_KEY:?run scripts/init.sh}
      NOTIFICATIONS_CONTACT_HASH_KEY: ${NOTIFICATIONS_CONTACT_HASH_KEY:?run scripts/init.sh}
      Inbox__SignalR__Redis: redis:6379
      # The juice-layout demo app (ng serve -c notifications) calls the API and the hub from its own origin.
      Cors__Origins__0: https://localhost:4201
      # The identity resolver's directory (phase-2-plan M16): tenants name it in their resolver settings ({"directory": "keycloak"}).
      Identity__Directories__keycloak__BaseUrl: http://keycloak:8080
      Identity__Directories__keycloak__Realm: juice
      Identity__Directories__keycloak__ClientId: notifications-directory
      Identity__Directories__keycloak__ClientSecretRef: env:NOTIFICATIONS_DIRECTORY_CLIENT_SECRET
      NOTIFICATIONS_DIRECTORY_CLIENT_SECRET: ${NOTIFICATIONS_DIRECTORY_CLIENT_SECRET:?run scripts/init.sh}
      # NotificationRequested over RabbitMQ (phase-1-plan I5); producers publish as their own broker user (README: RabbitMQ intake).
      Intake__RabbitMQ__Enabled: "true"
      # Events to producers over the same broker (phase-3-plan I37): topic exchange juice.notifications.events.
      Events__Enabled: "true"
      # The integration tests' webhook signing secret (TestHooks, a public test value), so the load check can aim at this container
      # (NOTIFICATIONS_LOAD_API): their integrations name env:NOTIFICATIONS_SECRET_TEST_HOOK, read here at send time.
      NOTIFICATIONS_SECRET_TEST_HOOK: test-signing-secret
      Intake__RabbitMQ__Host: rabbitmq
      Intake__RabbitMQ__UserName: notifications
      Intake__RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Audit__Endpoint: http://audit:8080
      # Tenant setup kept with the deployment (phase-1-plan I12): deploy/local/provisioning.json.
      Provisioning__Path: /config/provisioning.json
    volumes:
      - ./provisioning.json:/config/provisioning.json:ro
    configs:
      # The Console's settings, with the shared Keycloak's issuer (the built config.json says localhost, for ng serve), which is plain HTTP
      # here: allowed for any host, not only localhost (as Juice Observability's Console config).
      - source: console-config
        target: /app/wwwroot/config.json
    ports:
      - "127.0.0.1:5280:8080"
    # Keycloak is the shared one (dev-infra), reached as keycloak:8080 on the juice-dev network.
    networks: [default, juice-dev]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_started }
      redis: { condition: service_healthy }
      audit: { condition: service_healthy }

networks:
  # The shared dev infrastructure's network (../../../../dev-infra: docker compose up -d there first), for its Keycloak.
  juice-dev:
    external: true

configs:
  console-config:
    content: |
      {"apiBase": "", "auth": {"issuer": "http://${PUBLIC_HOST:-localhost}:8080/realms/juice", "clientId": "notifications-console", "scope": "openid juice-notifications", "requireHttps": false}}

volumes:
  postgres-data:
